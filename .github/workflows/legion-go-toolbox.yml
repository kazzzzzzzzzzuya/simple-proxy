name: Legion Go Toolbox plugin

on:
  push:
    paths:
      - "legion-go-toolbox/**"
      - ".github/workflows/legion-go-toolbox.yml"
  pull_request:
    paths:
      - "legion-go-toolbox/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legion-go-toolbox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and package
        run: bash scripts/package.sh
      - name: Typecheck
        run: pnpm run typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: legion-go-toolbox
          path: legion-go-toolbox/release/legion-go-toolbox.zip
