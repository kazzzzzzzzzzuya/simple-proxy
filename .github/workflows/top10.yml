name: Top 10 add-on

# Builds the ranked Top 10 add-on in top10/ and publishes it to the
# top10-addon branch, which is served as static files by raw.githubusercontent.com.
on:
  schedule:
    - cron: "23 21 * * *" # daily, 05:23 in UTC+8
  workflow_dispatch:
  push:
    branches: [dev, claude/nice-euler-j3dtkd]
    paths: ["top10/**", ".github/workflows/top10.yml"]

permissions:
  contents: write

concurrency:
  group: top10-addon
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow==11.0.0

      - name: Build add-on
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/top10-addon
        run: python top10/build.py "$RUNNER_TEMP/addon"

      - name: Publish to the top10-addon branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/addon"
          cp "$GITHUB_WORKSPACE/top10/fonts/OFL.txt" FONT-LICENSE.txt
          git init -q -b top10-addon
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Top 10 add-on $(date -u +%F)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" top10-addon
